# Every push to main builds the single-file page and publishes it as a GitHub Release with its
# SHA-256, so docs.fiber.so can link a fixed download whose hash never changes. The version is
# package.json's major.minor plus main's commit count (0.1.7 = 7th commit), so it's the same
# however often the build is rerun. A push that leaves the page byte-identical, such as a README
# edit, makes no new release.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  # Build provenance, so `gh attestation verify` can tie the file to this workflow and commit.
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.version.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit count sets the version.
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Keep in step with BUN_VERSION in render.yaml.
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile --ignore-scripts

      - run: bun audit

      # Anyone rebuilding this commit must get the same bytes, or the published hash means nothing.
      - name: Build twice and compare
        run: |
          bun run build
          cp dist/index.html "$RUNNER_TEMP/first.html"
          bun run build
          cmp "$RUNNER_TEMP/first.html" dist/index.html

      - name: Pick the version and skip unchanged builds
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version package.json | cut -d. -f1,2).$(git rev-list --count HEAD)"
          sha256="$(sha256sum dist/index.html | cut -d' ' -f1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -n "$latest" ] && gh release download "$latest" --pattern '*.sha256' --output - | grep -q "^$sha256 "; then
            echo "The page is unchanged since $latest."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Name the file and write its hash
        if: steps.version.outputs.publish == 'true'
        run: |
          name="fiber-recovery-v${{ steps.version.outputs.version }}.html"
          mv dist/index.html "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          cat "dist/$name.sha256"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.version.outputs.publish == 'true'
        with:
          subject-path: dist/fiber-recovery-v*.html

      - name: Tag and publish the release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.version.outputs.sha256 }}
        run: |
          name="fiber-recovery-v$VERSION.html"
          {
            echo "Built from $GITHUB_SHA with Bun 1.4.4."
            echo
            echo "SHA-256: \`$SHA256\`"
            echo
            echo "To check it, run \`bun install --frozen-lockfile --ignore-scripts && bun run build\` at this tag and compare the hash of \`dist/index.html\`."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" "dist/$name" "dist/$name.sha256" \
            --target "$GITHUB_SHA" --title "Fiber Recovery v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  # Serve this exact build on AWS (infra: fiberevm/fiber-infrastructure, environments/prod/recovery).
  # The image is built like the job above, and deploys only if its page has the SHA-256 that job just
  # built twice and verified, so recovery.fiber.so always serves the released, reproducible bytes.
  # GitHub Environment `production` (main only); the CI role trusts only that environment and can push
  # to its ECR repo, move the `prod` tag and start the fixed redeploy workflow.
  deploy-aws:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      APP: fiber-recovery
      AWS_REGION: us-east-2
      ACCOUNT_ID: "102186459705"
      EXPECTED_SHA256: ${{ needs.release.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/github-actions-${{ env.APP }}
          role-session-name: ${{ env.APP }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.APP }}:${{ github.sha }}

      - name: Check the served page is the released build
        run: |
          set -euo pipefail
          id=$(docker create "${{ steps.ecr.outputs.registry }}/$APP:$GITHUB_SHA")
          docker cp "$id:/usr/share/nginx/html/index.html" "$RUNNER_TEMP/index.html"
          docker rm "$id" >/dev/null
          actual=$(sha256sum "$RUNNER_TEMP/index.html" | cut -d' ' -f1)
          echo "Image page SHA-256: \`$actual\`" >> "$GITHUB_STEP_SUMMARY"
          [ "$actual" = "$EXPECTED_SHA256" ] || { echo "::error::Image page $actual != release build $EXPECTED_SHA256"; exit 1; }

      - name: Push ${{ env.APP }}:${{ github.sha }}
        run: |
          if ! aws ecr describe-images --repository-name "$APP" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            docker push "${{ steps.ecr.outputs.registry }}/$APP:$GITHUB_SHA"
          fi

      - name: Point prod at ${{ github.sha }}
        run: |
          set -euo pipefail
          image=$(aws ecr batch-get-image --repository-name "$APP" --image-ids imageTag="$GITHUB_SHA" \
            --query 'images[0].[imageManifest,imageManifestMediaType]' --output json)
          if ! out=$(aws ecr put-image --repository-name "$APP" --image-tag prod \
              --image-manifest "$(jq -r '.[0]' <<<"$image")" \
              --image-manifest-media-type "$(jq -r '.[1]' <<<"$image")" 2>&1); then
            grep -q ImageAlreadyExistsException <<<"$out" || { echo "$out"; exit 1; }
          fi

      - name: Redeploy
        id: redeploy
        run: |
          set -euo pipefail
          out=$(aws stepfunctions start-sync-execution --output json \
            --state-machine-arn "arn:aws:states:$AWS_REGION:$ACCOUNT_ID:stateMachine:$APP-redeploy")
          if [ "$(jq -r .status <<<"$out")" = SUCCEEDED ]; then echo "started=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if grep -q ServiceNotFound <<<"$(jq -r '.error, .cause' <<<"$out")"; then
            echo "::warning::The ECS service doesn't exist yet; the image is tagged prod."; exit 0
          fi
          jq '{status, error, cause}' <<<"$out"; exit 1

      - name: Wait for the rollout
        if: steps.redeploy.outputs.started == 'true'
        run: aws ecs wait services-stable --cluster fiber-prod-cluster --services "$APP"

