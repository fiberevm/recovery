# recovery.fiber.so on AWS ECS: serves the single built page with the same headers as render.yaml.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # The page's own <meta> policy can't forbid framing, so a hostile site could otherwise embed it and
    # trick clicks while a backup is unlocked.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Every deploy replaces the single page, so browsers should always check for a new one.
    add_header Cache-Control "no-cache" always;

    location = / {
        try_files /index.html =404;
    }
    location = /index.html {
        try_files /index.html =404;
    }
    location / {
        return 404;
    }
}
